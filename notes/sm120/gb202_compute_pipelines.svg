<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1080"
     viewBox="0 0 1540 1080" role="img" aria-labelledby="title desc">
  <title id="title">GB202 subcore scalar and tensor pipeline model</title>
  <desc id="desc">A silicon-constrained microarchitectural hypothesis for
  one GB202 subcore. It separates register collection, family admission,
  specialized scalar execution bodies, tensor admission and HMMA/IMMA
  subpipes, forwarding, completion staging and parity-steered RF commit.</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family:Inter,"Noto Sans","Noto Sans CJK SC",Arial,sans-serif; fill:#172033; }
      .title { font-size:26px; font-weight:700; }
      .subtitle { font-size:13px; fill:#526176; }
      .region { fill:#f8fafc; stroke:#64748b; stroke-width:1.6; rx:14; }
      .rtitle { font-size:17px; font-weight:700; fill:#334155; }
      .box { stroke:#475569; stroke-width:1.2; rx:7; filter:url(#shadow); }
      .sched { fill:#bfdbfe; }
      .rf { fill:#ddd6fe; }
      .collect { fill:#e9d5ff; }
      .admit { fill:#fef3c7; }
      .int { fill:#bbf7d0; }
      .fp { fill:#a7f3d0; }
      .packed { fill:#fde68a; }
      .tensor { fill:#fbcfe8; }
      .result { fill:#bae6fd; }
      .commit { fill:#fecaca; }
      .external { fill:#e2e8f0; }
      .label { font-size:14px; font-weight:650; text-anchor:middle; }
      .small { font-size:11px; fill:#475569; text-anchor:middle; }
      .tiny { font-size:9.8px; fill:#64748b; text-anchor:middle; }
      .tag { font-size:9px; font-weight:700; text-anchor:middle; }
      .flow { fill:none; stroke:#334155; stroke-width:1.7; marker-end:url(#arr); }
      .wide { fill:none; stroke:#2563eb; stroke-width:2.5; marker-end:url(#arr); }
      .inferred { fill:none; stroke:#64748b; stroke-width:1.5; stroke-dasharray:7 5; marker-end:url(#arr); }
      .feedback { fill:none; stroke:#dc2626; stroke-width:1.6; stroke-dasharray:7 5; marker-end:url(#arr-red); }
      .couple { fill:none; stroke:#7c3aed; stroke-width:1.8; stroke-dasharray:3 5; marker-end:url(#arr-purple); }
      .note { font-size:10px; fill:#64748b; }
    </style>
  </defs>

  <rect width="1540" height="1080" fill="#ffffff"/>
  <text x="42" y="37" class="title">GB202 compute datapaths — one-subcore hypothesis</text>
  <text x="42" y="60" class="subtitle">Measured constraints from RTX 5090 / sm_120 · boxes are behavioral resources, not transistor-level claims</text>

  <rect x="30" y="78" width="1480" height="920" class="region"/>
  <text x="51" y="106" class="rtitle">Subcore-local compute domain</text>

  <!-- Scheduler and early admission -->
  <rect x="80" y="128" width="1380" height="92" class="box sched"/>
  <text x="770" y="153" class="label">Warp scheduler · predicate · family issue/admission</text>
  <text x="770" y="174" class="small">predicated-off IADD3, packed-FP and tensor instructions can retain pipe occupancy / math throttle</text>
  <text x="770" y="192" class="small">therefore target-pipe credit is acquired before effective predicate suppression</text>
  <text x="770" y="209" class="tiny">FFMA/FADD fmalite traffic does not expose the same saturation-throttle signature</text>

  <!-- RF and collection -->
  <rect x="80" y="254" width="600" height="190" class="region" fill="#f5f3ff"/>
  <text x="99" y="279" class="rtitle">Operand delivery</text>
  <rect x="104" y="302" width="190" height="78" class="box rf"/>
  <text x="199" y="326" class="label">Even RF bank</text>
  <text x="199" y="347" class="small">1 row address / cycle</text>
  <text x="199" y="365" class="tiny">one warp-wide operand service</text>
  <rect x="320" y="302" width="190" height="78" class="box rf"/>
  <text x="415" y="326" class="label">Odd RF bank</text>
  <text x="415" y="347" class="small">1 row address / cycle</text>
  <text x="415" y="365" class="tiny">one warp-wide operand service</text>
  <rect x="536" y="294" width="120" height="96" class="box collect"/>
  <text x="596" y="320" class="label">Collector</text>
  <text x="596" y="341" class="small">E/O parallel</text>
  <text x="596" y="359" class="small">full-warp row</text>
  <text x="596" y="377" class="tiny">mask does not split</text>
  <rect x="104" y="398" width="552" height="30" class="box collect"/>
  <text x="380" y="418" class="small">shared operand crossbar / steering toward specialized bodies</text>
  <path d="M199 302 V288 H596 V294 M510 341 H536 M596 390 V398" class="flow"/>
  <text x="380" y="390" class="tiny">2E+1O → 2 collection cycles · 3E → 3 cycles · 1E+1O → 1 cycle</text>

  <!-- Family admission -->
  <rect x="710" y="254" width="750" height="190" class="region" fill="#fffbeb"/>
  <text x="729" y="279" class="rtitle">Family-local admission and steering</text>
  <rect x="734" y="302" width="160" height="82" class="box admit"/>
  <text x="814" y="324" class="label">ALU Heavy</text>
  <text x="814" y="345" class="small">IADD3 · LOP3 · PRMT</text>
  <text x="814" y="363" class="small">≈0.5 inst/cycle</text>
  <text x="814" y="378" class="tag" fill="#b45309">ALUHEAVY THROTTLE</text>

  <rect x="913" y="302" width="160" height="82" class="box admit"/>
  <text x="993" y="324" class="label">Shared FMA Heavy</text>
  <text x="993" y="345" class="small">ALU Lite move/select · FMA Heavy IMAD</text>
  <text x="993" y="363" class="small">LO ≈0.5 · HI/WIDE ≈0.25</text>
  <text x="993" y="378" class="tiny">two leaf subpipes; NCU-resolved</text>

  <rect x="1092" y="302" width="160" height="82" class="box admit"/>
  <text x="1172" y="324" class="label">FMA Lite</text>
  <text x="1172" y="345" class="small">FADD · FFMA</text>
  <text x="1172" y="363" class="small">≥1 inst/cycle if RF permits</text>
  <text x="1172" y="378" class="tag" fill="#047857">NO SATURATION THROTTLE</text>

  <rect x="1271" y="302" width="165" height="82" class="box admit"/>
  <text x="1353" y="324" class="label">Packed FP</text>
  <text x="1353" y="345" class="small">HFMA2 · HADD2 · HMUL2</text>
  <text x="1353" y="363" class="small">≈0.5 inst/cycle</text>
  <text x="1353" y="378" class="tag" fill="#b45309">FMAHEAVY THROTTLE</text>

  <rect x="914" y="398" width="521" height="30" class="box collect"/>
  <text x="1174" y="418" class="small">packed-FP ↔ fmalighter steering / mode-credit constraint</text>
  <path d="M993 384 V398 M1172 384 V398 M1353 384 V398" class="couple"/>
  <text x="809" y="414" class="tiny">simple INT has no early cross-family conflict</text>

  <!-- Operand packets enter family steering before specialized bodies. -->
  <path d="M656 413 H710" class="wide"/>
  <path d="M380 220 V254 M1085 220 V254" class="flow"/>
  <path d="M1400 220 H1477 V554 H1436" class="flow"/>

  <!-- Scalar execution -->
  <rect x="80" y="474" width="970" height="220" class="region" fill="#f0fdf4"/>
  <text x="99" y="500" class="rtitle">Specialized scalar execution bodies</text>
  <rect x="104" y="520" width="205" height="114" class="box int"/>
  <text x="206" y="546" class="label">ALU Heavy / FXU body</text>
  <text x="206" y="568" class="small">add · logic · shift · predicate</text>
  <text x="206" y="588" class="small">genuine ≈0.5 inst/cycle floor</text>
  <text x="206" y="609" class="tiny">separate arithmetic body</text>

  <rect x="329" y="520" width="205" height="114" class="box int"/>
  <text x="431" y="546" class="label">Shared FMA Heavy</text>
  <text x="431" y="568" class="small">ALU Lite: move/select · FMA Heavy: IMAD/IDP</text>
  <text x="431" y="588" class="small">LO 2 cyc · HI/WIDE 4 cyc</text>
  <text x="431" y="609" class="tiny">one physical pipe, two named subpipes</text>

  <rect x="554" y="520" width="205" height="114" class="box fp"/>
  <text x="656" y="546" class="label">FMA Lite body</text>
  <text x="656" y="568" class="small">FFMA · FADD</text>
  <text x="656" y="588" class="small">≥1 inst/cycle backend</text>
  <text x="656" y="609" class="tiny">common 2-cycle FFMA is RF-bound</text>

  <rect x="779" y="520" width="245" height="114" class="box packed"/>
  <text x="901" y="546" class="label">Packed-FP body</text>
  <text x="901" y="568" class="small">HFMA2 · HADD2 · HMUL2</text>
  <text x="901" y="588" class="small">genuine ≈0.5 inst/cycle floor</text>
  <text x="901" y="609" class="tiny">arithmetic sharing with FP32 is unproven</text>

  <!-- Map admission boxes to execution bodies; deliberately crossed -->
  <path d="M814 384 V460 H206 V520" class="flow"/>
  <path d="M993 384 V452 H431 V520" class="flow"/>
  <path d="M1172 384 V444 H656 V520" class="flow"/>
  <path d="M1353 428 V464 H901 V520" class="flow"/>

  <rect x="104" y="650" width="920" height="28" class="box result"/>
  <text x="564" y="669" class="small">per-pipe bypass and result staging · same-pipe forward ≈2 cycles · INT↔fmal cross-hop ≈3 cycles</text>
  <path d="M206 634 V650 M431 634 V650 M656 634 V650 M901 634 V650" class="flow"/>

  <!-- Tensor domain -->
  <rect x="1080" y="474" width="380" height="330" class="region" fill="#fdf2f8"/>
  <text x="1099" y="500" class="rtitle">Tensor domain</text>
  <rect x="1104" y="520" width="332" height="68" class="box tensor"/>
  <text x="1270" y="543" class="label">Shared tensor admission / credit pool</text>
  <text x="1270" y="564" class="small">subcore-local · acquired before effective predicate</text>
  <text x="1270" y="581" class="tag" fill="#be185d">STRONG MATH_PIPE_THROTTLE</text>

  <rect x="1104" y="616" width="154" height="108" class="box tensor"/>
  <text x="1181" y="642" class="label">HMMA subpipe</text>
  <text x="1181" y="663" class="small">HMMA · QMMA</text>
  <text x="1181" y="682" class="small">5090: 32 · PRO 6000: 16 cycles</text>
  <text x="1181" y="702" class="tiny">same reported resource</text>

  <rect x="1282" y="616" width="154" height="108" class="box tensor"/>
  <text x="1359" y="642" class="label">IMMA subpipe</text>
  <text x="1359" y="663" class="small">IMMA.16816</text>
  <text x="1359" y="682" class="small">16 cycles / inst on both SKUs</text>
  <text x="1359" y="702" class="tiny">partially overlaps HMMA</text>
  <path d="M1270 588 V601 H1181 V616 M1270 601 H1359 V616" class="flow"/>

  <rect x="1104" y="748" width="332" height="38" class="box result"/>
  <text x="1270" y="765" class="small">tensor completion staging / accumulator return</text>
  <text x="1270" y="779" class="tiny">non-scoreboarded RAW: consumers require conservative spacing</text>
  <path d="M1181 724 V748 M1359 724 V748" class="inferred"/>

  <!-- Scalar and tensor input relation -->
  <path d="M656 413 H1062 V554 H1104" class="flow"/>
  <text x="927" y="469" class="note">shared scalar/tensor RF-delivery frontend; tensor uses group packing/staging after it</text>

  <!-- Completion and commit -->
  <rect x="80" y="726" width="970" height="168" class="region" fill="#eff6ff"/>
  <text x="99" y="752" class="rtitle">Forwarding, completion and architectural RF commit</text>
  <rect x="104" y="770" width="276" height="76" class="box external"/>
  <text x="242" y="794" class="label">Other result producers</text>
  <text x="242" y="815" class="small">MIO2RF · independent XU return</text>
  <text x="242" y="833" class="tiny">share only the final parity-bank service</text>

  <rect x="414" y="770" width="305" height="76" class="box result"/>
  <text x="566" y="794" class="label">Bypass / result queues</text>
  <text x="566" y="815" class="small">absorb fixed-pipe completion collisions</text>
  <text x="566" y="833" class="tiny">RAW forwarding can precede RF visibility</text>

  <rect x="753" y="770" width="271" height="76" class="box commit"/>
  <text x="888" y="794" class="label">Parity-steered commit merge</text>
  <text x="888" y="815" class="small">one architectural write opportunity</text>
  <text x="888" y="833" class="tiny">per even/odd bank service slot</text>

  <path d="M564 678 V770" class="flow"/>
  <path d="M380 808 H414 M719 808 H753" class="flow"/>
  <path d="M1104 767 H1042 V808 H1024" class="flow"/>

  <rect x="414" y="862" width="145" height="60" class="box rf"/>
  <text x="486" y="886" class="label">Even RF 1W</text>
  <text x="486" y="906" class="tiny">bank-local arbiter</text>
  <rect x="574" y="862" width="145" height="60" class="box rf"/>
  <text x="646" y="886" class="label">Odd RF 1W</text>
  <text x="646" y="906" class="tiny">bank-local arbiter</text>
  <path d="M888 846 V854 H486 V862 M888 854 H646 V862" class="flow"/>

  <path d="M486 922 V958 H199 V380" class="feedback"/>
  <path d="M646 922 V972 H415 V380" class="feedback"/>
  <text x="745" y="956" class="note">architectural commit ≈5.4–5.8 cycles in the calibrated fixed-pipe probes</text>

  <!-- SM-wide FP64 escape -->
  <rect x="1080" y="828" width="380" height="94" class="box external"/>
  <text x="1270" y="854" class="label">SM-wide FP64 service (outside this subcore)</text>
  <text x="1270" y="876" class="small">DADD / DFMA · ≈1 instruction / 16 cycles per SM</text>
  <text x="1270" y="896" class="small">all four subcores feed one arbitration domain</text>
  <text x="1270" y="914" class="tiny">operand sources remain in their respective local RF collectors</text>
  <path d="M656 428 H1060 V875 H1080" class="inferred"/>

  <!-- Throttle summary -->
  <rect x="80" y="940" width="1380" height="38" fill="#fff7ed" stroke="#fb923c" rx="7"/>
  <text x="770" y="964" class="small">math_pipe_throttle is best modelled as OR(summary) of unavailable per-target credits: ALUHEAVY, FMAHEAVY and tensor can assert it; it does not imply one global math FIFO</text>

  <!-- Legend -->
  <rect x="30" y="1015" width="1480" height="46" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <path d="M59 1038 H111" class="flow"/><text x="126" y="1043" class="note">high-confidence measured path/resource separation</text>
  <path d="M430 1038 H482" class="inferred"/><text x="497" y="1043" class="note">architectural relation; exact physical wiring unresolved</text>
  <path d="M852 1038 H904" class="couple"/><text x="919" y="1043" class="note">measured steering/credit interference, not a shared arithmetic body</text>
</svg>
